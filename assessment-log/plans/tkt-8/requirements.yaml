- id: 15
  summary: Score contract - how the score is read from responses_json
  category: data-contract
  source: user:2026-11-07
  source_text: we'll have to make an educated guess/assumption and stick with it
  acceptance: 'A reader returns the score as an integer 0-100 or nil: it takes the
    first valid value from the top-level keys score, assessment_score, total_score,
    overall_score in that order and never combines them; accepts numbers and strings
    (trimmed, trailing % stripped, a single decimal comma read as a point); ambiguous
    text such as ''1,234'', ''N/A'' or empty is invalid; values below 0 or above 100
    are invalid; a value strictly between 0 and 1 is NOT scaled and is invalid (counted
    separately); rounds half up. A unit test table covers each case, including a non-hash
    or nil responses_json.'
  status: active
  blocked_on:
  decided_by: user, 2026-11-07 (contract accepted Q-A; proportions shown as not available
    per T2-5 and Q-G)
  supersedes: my first proposal that scaled proportions (0.85 to 85)
  domain: score
  risk: []
- id: 16
  summary: The dashboard shows 'Score not available' when no valid score exists, and
    status never gates the score
  category: edge-case
  source: user:2026-11-07
  source_text: I would rather the user see 'score not available' than an error screen
    cause of a nil error
  acceptance: 'A dashboard row with an invalid or missing score renders ''Score not
    available'' (CSV: blank) and the page returns 200; a pending and a completed row
    with the same valid score both show it; the reader never raises - an unexpected
    error in one row is rescued, logged with only the error class and assessment id,
    and that row shows ''Score not available''; there is no footnote saying scores
    are normalised.'
  status: active
  blocked_on:
  decided_by: user, 2026-11-07
  supersedes: earlier agreement to show a dash; my proposed 'may differ' footnote
  domain: score
  risk: []

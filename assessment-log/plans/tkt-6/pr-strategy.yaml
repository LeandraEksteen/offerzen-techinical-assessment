  - "MC-1 [manual] local: run the benchmark after the change and append the row to the benchmarks table"
  - "MC-2 [manual] local: with Bullet on, load page 1, a middle page, a filtered page and the last page of the largest company: log/bullet.log stays empty (no N+1, no unused eager loading)"
  - "MC-3 [manual] local: diff dashboard:snapshot for both views against the committed baseline snapshots: no differences"
  - "MC-4 [manual] local: confirm in the development log that a page runs one assessments query and one employees query selecting only id and email"
  - "MC-5 [manual] local: repeat the ab load test on the normal-user page and record the change"

    changes: |
      Add bcrypt; migrations and models for companies, employees, assessments and admins;
      sign-in/sign-out and a placeholder home page for signed-in admins (company from the
      session only); small db/seeds.rb; a separate rake task that seeds about 500,000 messy
      assessments; tests; log, ticket and decision updates.
    stubs: none
    tests:
      - UT-1 [positive] models and associations load; assessment_date required; status and responses_json nullable
      - UT-2 [negative] assessment without assessment_date or company is invalid; admin email unique and requires company
      - UT-3 [positive] valid sign-in stores the admin in the session and the home page shows the admin's company
      - UT-4 [negative] wrong password creates no session
      - UT-5 [negative] unauthenticated request is redirected to sign-in
      - UT-6 [edge] a company_id parameter for another company does not change the company shown
      - UT-7 [positive] seed generator at small size creates the requested counts across companies with one dominant company, and every dirty status and score shape appears
      - UT-8 [edge] seeding refuses to run in production
    test_command: bin/rails db:test:prepare test
    lint_command: bin/rubocop && bin/brakeman --no-pager && bin/bundler-audit

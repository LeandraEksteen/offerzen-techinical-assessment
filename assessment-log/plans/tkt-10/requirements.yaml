- id: 29
  summary: Ruby-side validation allows only the five canonical statuses, on create
    and when status changes
  category: business-rule
  source: user:2026-11-07
  source_text: we should rather prevent any non standard value being written on the
    ruby side
  acceptance: Canonical values are pending, in_progress, completed, needs_follow_up,

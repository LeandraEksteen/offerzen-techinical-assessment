  - "MC-2 [manual] throwaway copy of the dev database: time add-column (lock held), a 5,000-row batch update, the partial index CONCURRENTLY, the verification count with and without it, and the two renames in one transaction; numbers go in the plan document, nothing else is committed"
  - "MC-3 [manual] read the plan document against Req 31 to 34, 42 and 43: every step has a label, a lock note and a rollback; thresholds, backup and recovery commands present"

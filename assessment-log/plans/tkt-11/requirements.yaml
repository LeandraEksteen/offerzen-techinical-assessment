- id: 34
  summary: SOLUTION.md has the step-by-step release and rollback plan for a Heroku-like
    host
  category: operational
  source: prd:OfferZen assignment PDF §Task 3
  source_text: provide a step by step release and rollback plan suitable for a Heroku
    like environment, including how you would capture a database backup before the
    change and how you would recover if needed.
  acceptance: 'The plan lists in order: (1) add a nullable column (instant) and deploy
    code writing both columns; (2) backfill in batches of about 5,000 ids from a one-off
    dyno, throttled, resumable, idempotent; (3) verify 100% filled and no unmapped;
    (4) switch the app to the new column with an alias; (5) keep writing the legacy
    column; (6) rename in a short low-traffic window with Heroku maintenance mode,
    both renames in one transaction under a short lock_timeout, then deploy code using
    plain status; (7) drop legacy_status later. Steps 1 to 4 and the report are labelled
    live-safe; step 6 is labelled low-traffic window; each step has its rollback and
    a backup is captured before step 6.'
  status: active
  blocked_on:
  decided_by: user, 2026-11-07 (T3-H accepted)
  supersedes:
  domain: status
  risk:
  - state-transition

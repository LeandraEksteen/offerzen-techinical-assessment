- id: 43
  summary: Lock and responsiveness safeguards for the large table are stated and agreed
  category: operational
  source: user:2026-11-07
  source_text: Keep the app responsive throughout. Avoid changes that would lock or
    stall the large assessments table.
  acceptance: 'SOLUTION.md names for each step its lock behaviour and mitigation:
    short lock_timeout with retry on the column add, the rename and the later drop;
    row-id batches with a throttle; pause thresholds of replication lag over 5 seconds,
    any lock wait over 2 seconds, or request latency over 1.5 times baseline; no long
    transactions; any index on the new column built CONCURRENTLY; verification counts
    run off the primary or on a partial index; statement_timeout on the backfill.'
  status: active

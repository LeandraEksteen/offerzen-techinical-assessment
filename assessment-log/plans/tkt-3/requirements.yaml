  domain: export
  risk: []
- id: 7
  summary: Export runs asynchronously with a history table on the download page
  category: functional
  source: user:2026-11-07
  source_text: The user selects the filters and clicks download. After a second or
    two the page auto refreshes Then there is a 'history' table on the download page
  acceptance: Clicking download creates a history row with status 'in progress' and

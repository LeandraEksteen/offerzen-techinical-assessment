- id: 6
  summary: The status select lists the distinct statuses stored for the admin's own
    company, grouped without changing data
  category: functional
  source: user:2026-11-07
  source_text: Unique per company records as per the admin logged in, so not the entire
    table, just the relevant records. also it would be fine to group to whitespace
    strip and case insensitive
  acceptance: For a company whose rows hold 'Complete', 'complete ' and 'COMPLETE'
    the select shows one option labelled 'complete' that filters all three; nil, empty
    string and blank-only share one option '(no status)' that filters all of them;
